name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Release on version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — version not bumped, nothing to release."
            exit 0
          fi

          bun install --production --frozen-lockfile
          rm -rf pkg && mkdir -p pkg/ymb
          mkdir -p pkg/ymb/mods
          cp -r index.ts src docs package.json bun.lock tsconfig.json LICENSE NOTICE README.md node_modules pkg/ymb/
          ( cd pkg && zip -rq "../ymb-${VERSION}.zip" ymb )

          rm -rf smoke && mkdir smoke
          unzip -q "ymb-${VERSION}.zip" -d smoke
          test -f smoke/ymb/docs/getting-started.md

          gh release create "$TAG" "ymb-${VERSION}.zip" --title "$TAG"
